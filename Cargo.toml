[package]
name = "vesperplusplus"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
axum = {version="0.8.9", features = ["tokio"]}
bstr = "1.13.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
kdam = "0.6.4"
reqwest = {version="0.13.4", features = ["hickory-dns", "gzip", "brotli", "deflate", "stream"]}
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "rt-multi-thread"] }
tokio-stream = "0.1.19"
